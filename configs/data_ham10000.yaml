# Dataset B: HAM10000 (7-class dermoscopy, lesion masks for P1).
# dx_type is deliberately NOT used: it encodes how the label was confirmed (label leakage).
data:
  name: ham10000
  processed_csv: ${MEDFUSION_DATA:C:/Projects/medfusion-xai/data}/processed/ham10000/samples.csv
  task: multiclass
  classes: [akiec, bcc, bkl, df, mel, nv, vasc]
  group_col: lesion_id
  categorical: [sex, localization]
  continuous: [age]
  counterfactual:
    irrelevant: []
    relevant: [sex]
