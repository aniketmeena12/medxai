# Dataset C: ISIC 2019 artifact trap sets (Bissoto et al., ISIC@ECCV 2022), binary.
# Splits come from the published CSVs, not from our fold builder.
data:
  name: isic2019_trap
  processed_csv: ${MEDFUSION_DATA:C:/Projects/medfusion-xai/data}/processed/isic2019/samples.csv
  trap_dir: ${MEDFUSION_DATA:C:/Projects/medfusion-xai/data}/annotations/artifact-generalization-skin/trap_sets
  task: binary
  classes: [benign, malignant]
  group_col: lesion_id
  categorical: [sex, anatom_site_general]
  continuous: [age_approx]
  image_bias_levels: [0, 0.3, 0.5, 0.7, 0.9, 1]
  splits: [1, 2, 3]
  seeds: [0]   # one seed per published split (docs/04-preregistration.md change log)
  # Primary analysis drops val/test images whose lesion is in training (published splits leak
  # ~2,000 lesions). scripts/train_trap.py --published runs the unfiltered secondary analysis.
  lesion_leak_filter: true
  # N1 metadata trap (docs/04-preregistration.md §6)
  metadata_trap:
    field: sex
    levels: [0, 0.5, 0.9]
    grid_image_levels: [0, 0.5, 0.9]
    min_train_images: 1000
