# Dataset A: PAD-UFES-20 (6-class, smartphone clinical images, 21 metadata fields).
data:
  name: padufes20
  processed_csv: ${MEDFUSION_DATA:data}/processed/padufes20/samples.csv
  task: multiclass
  classes: [ACK, BCC, MEL, NEV, SCC, SEK]
  group_col: patient_id
  categorical: [region, fitspatrick, gender, smoke, drink, background_father, background_mother,
                pesticide, skin_cancer_history, cancer_history, has_piped_water,
                has_sewage_system, itch, grew, hurt, changed, bleed, elevation]
  continuous: [age, diameter_1, diameter_2]
  # Pre-registered for P4 (docs/04-preregistration.md §5). Do not edit after results are seen.
  counterfactual:
    irrelevant: [has_piped_water, has_sewage_system]
    relevant: [bleed, grew, itch, changed, elevation]
